<div class="login-container">
    <div class="login-background"></div>
    
    <div class="login-content">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="assets/layout/images/logo-shessmat.png" alt="Shessmat" class="logo-image">
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <h1 class="login-title">Bienvenido a Shessmat</h1>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            <!-- Error Message -->
            <div *ngIf="loginError" class="alert-error">
                <i class="pi pi-exclamation-circle"></i>
                <span>{{ loginError }}</span>
            </div>

            <!-- Form -->
            <form [formGroup]="loginForm" class="login-form">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email1" class="form-label">
                        <i class="pi pi-envelope"></i>
                        Correo Electrónico
                    </label>
                    <input 
                        id="email1"
                        formControlName="username" 
                        type="email"  
                        pInputText 
                        placeholder="tu@correo.com" 
                        class="form-input"
                        [class.form-input-error]="email.invalid && (email.dirty || email.touched)">
                    <div *ngIf="email.invalid && (email.dirty || email.touched)" class="error-message">
                        <div *ngIf="email.errors?.['required']">
                            <i class="pi pi-times-circle"></i>
                            El correo electrónico es requerido
                        </div>
                        <div *ngIf="email.errors?.['email']">
                            <i class="pi pi-times-circle"></i>
                            Ingresa un correo electrónico válido
                        </div>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password1" class="form-label">
                        <i class="pi pi-lock"></i>
                        Contraseña
                    </label>
                    <p-password 
                        id="password1"
                        formControlName="password" 
                        placeholder="Ingresa tu contraseña" 
                        styleClass="w-full"
                        inputStyleClass="form-input-password"
                        [feedback]="false"
                        [toggleMask]="true">
                    </p-password>
                    <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error-message">
                        <div *ngIf="password.errors?.['required']">
                            <i class="pi pi-times-circle"></i>
                            La contraseña es requerida
                        </div>
                    </div>
                </div>



                <!-- Login Button -->
                <button 
                    pButton 
                    pRipple 
                    label="Iniciar Sesión" 
                    class="login-button"
                    (click)="login()"
                    type="button">
                </button>
            </form>


        </div>

        <!-- Footer Info -->
        <div class="login-info">
            <p>&copy; 2024 Shessmat. Todos los derechos reservados.</p>
        </div>
    </div>
</div>
